<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maison Solstice – Blog</title>
  <style>
    /* Reset basique */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* Corps de page */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      background-color: #ffffff;
      color: #222222;
      padding: 2rem;
    }
    /* En‐tête */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }
    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    header h2 {
      font-size: 1.75rem;
      font-weight: 400;
      color: #555;
      margin-bottom: 0.5rem;
    }
    header time {
      font-size: 0.9rem;
      color: #888;
    }
    /* Contenu de l’article */
    main {
      max-width: 800px;
      margin: 0 auto;
    }
    article p {
      margin-bottom: 1.5rem;
    }
    /* Pied de page */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #aaa;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Maison Solstice</h1>
    <h2>Une maison pour ne faire plus qu’un avec la nature</h2>
    <time datetime="2024-04-24">24 avril 2024</time>
  </header>

  <main>
    <article>
      <p><!-- Ici, votre premier paragraphe de l’article – par exemple une introduction à Maison Solstice. --></p>
      <p><!-- Deuxième paragraphe : détails sur l’architecture, l’aspect durable, l’environnement, etc. --></p>
      <p><!-- Troisième paragraphe, etc. --></p>
    </article>
  </main>

  <footer>
    &copy; 2024 Maison Solstice – Tous droits réservés.
  </footer>

</body>
</html>
